<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZENTRO | Campus Parking</title>
<style>
:root{--navy:#14233b;--blue:#315efb;--bg:#f4f6fb;--ink:#182338;--muted:#738097;--line:#e6eaf1;--green:#16845b;--red:#c74a4a;--amber:#a66a12}
*{box-sizing:border-box}body{margin:0;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:650}button.secondary{background:#eef2ff;color:#3153d8}button.ghost{background:white;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0f0;color:var(--red)}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{font-size:22px;font-weight:850;letter-spacing:2px;padding:0 12px}.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#9fb0ca;margin-top:4px}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#c6d1e2;text-align:left;font-weight:550}.nav button.active,.nav button:hover{background:#263956;color:white}.sidefoot{margin-top:auto;color:#9fb0ca;font-size:12px;padding:10px 12px;line-height:1.6}
main{min-width:0}.top{height:76px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top h2{margin:0;font-size:17px}.profile{display:flex;align-items:center;gap:12px;color:var(--muted)}.avatar{background:#e8edff;color:#3153d8;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.content{padding:30px 34px;max-width:1400px;margin:auto}.eyebrow{color:var(--blue);font-weight:750;text-transform:uppercase;font-size:11px;letter-spacing:1.2px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.heading h1{font-size:27px;margin:5px 0}.sub{color:var(--muted);margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:19px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;margin:10px 0 4px}.stat small{color:var(--muted)}.stat .ico{float:right;background:#eef2ff;color:var(--blue);padding:9px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.panel h3{margin:0 0 15px;font-size:15px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panelhead h3{margin:0}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.slot{border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;background:#f8fafc}.slot b{display:block;font-size:13px}.slot span{font-size:11px;color:var(--muted)}.slot.free{background:#effaf5;border-color:#ccebdc}.slot.busy{background:#fff4f2;border-color:#f4d7d1}.slot.maint{background:#fff8e9;border-color:#f2e0b9}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:11px 8px;border-bottom:1px solid var(--line)}td{padding:13px 8px;border-bottom:1px solid #f0f2f6}tr:last-child td{border-bottom:0}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#eef2ff;color:#3153d8;font-weight:700}.pill.green{background:#e8f7ef;color:var(--green)}.pill.red{background:#fff0ef;color:var(--red)}.pill.amber{background:#fff5df;color:var(--amber)}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:white;min-width:0;color:var(--ink)}.toolbar input{min-width:220px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:700;color:#526078}.field input,.field select,.field textarea{width:100%}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.empty{padding:35px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;background:#eff4ff;color:#3451a5;border-radius:10px;margin-bottom:18px;font-size:12px;line-height:1.5}
.modalback{position:fixed;inset:0;background:#0b183080;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modalback.show{display:flex}.modal{background:white;border-radius:16px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 70px #07142c44}.modal h2{margin:0 0 18px}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.toast{position:fixed;right:22px;bottom:22px;background:#14233b;color:white;padding:13px 18px;border-radius:10px;display:none;z-index:10;box-shadow:0 8px 30px #0002}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{padding:14px;gap:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.top{padding:0 18px}.content{padding:22px 18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.slots{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.heading{align-items:start;flex-direction:column}.toolbar input{min-width:100%}}
</style></head>
<body>
<div class="app">
<aside class="side">
 <div class="brand">ZENTRO<small>CAMPUS PARKING SYSTEM</small></div>
 <div class="nav" id="nav">
  <button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button>
  <button data-page="vehicles">▣ &nbsp; Vehicles</button>
  <button data-page="parking">▤ &nbsp; Parking & Slots</button>
  <button data-page="visitors">♙ &nbsp; Visitors</button>
  <button data-page="violations">⚑ &nbsp; Violations</button>
  <button data-page="reports">▥ &nbsp; Reports</button>
 </div>
 <div class="sidefoot">ZENTRO Prototype v1.0<br>Academic demonstration build</div>
</aside>
<main>
 <header class="top"><h2 id="topTitle">Dashboard</h2><div class="profile"><span id="roleLabel">Admin</span><select id="roleSelect" aria-label="Choose role"><option>Admin</option><option>Security Staff</option><option>Student</option><option>Faculty/Staff</option></select><div class="avatar">Z</div></div></header>
 <div class="content" id="view"></div>
</main></div>
<div class="modalback" id="modalback"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modalfoot"><button class="ghost" onclick="closeModal()">Cancel</button><button onclick="submitModal()">Save record</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let page='dashboard', role='Admin', modalAction=null;
let vehicles=[
 {id:1,owner:'Aarav Sharma',type:'Car',number:'DL8CAF1234',category:'Student'},
 {id:2,owner:'Meera Kapoor',type:'Bike',number:'DL3SBC8821',category:'Faculty/Staff'},
 {id:3,owner:'Kabir Singh',type:'Car',number:'DL10CK4520',category:'Student'},
 {id:4,owner:'Neha Verma',type:'Scooter',number:'DL5SAX1190',category:'Student'}
];
let slots=Array.from({length:20},(_,i)=>({id:i+1,name:'A-'+String(i+1).padStart(2,'0'),status:i<8?'Occupied':i===18?'Maintenance':'Available'}));
let sessions=[
 {id:1001,vehicle:'DL8CAF1234',owner:'Aarav Sharma',slot:'A-01',entry:'09:12 AM',exit:'—',status:'Active'},
 {id:1002,vehicle:'DL3SBC8821',owner:'Meera Kapoor',slot:'A-02',entry:'09:28 AM',exit:'—',status:'Active'},
 {id:1003,vehicle:'DL10CK4520',owner:'Kabir Singh',slot:'A-03',entry:'08:45 AM',exit:'11:10 AM',status:'Closed'}
];
let visitors=[{name:'Rohan Malhotra',number:'DL4CAD7788',purpose:'Meeting with faculty',date:'Today'}];
let violations=[{number:'DL7CBB1200',type:'Wrong parking',detail:'Parked outside marked slot',time:'10:35 AM'}];
const canAdmin=()=>role==='Admin', canSecurity=()=>role==='Admin'||role==='Security Staff';
function toast(m){let t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function nav(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)nav(b.dataset.page)});
$('#roleSelect').onchange=e=>{role=e.target.value;$('#roleLabel').textContent=role;render()};
function head(kicker,title,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function stat(label,val,desc,ico){return `<div class="stat"><span class="ico">${ico}</span><div class="label">${label}</div><strong>${val}</strong><small>${desc}</small></div>`}
function badge(status){let c=status==='Available'||status==='Closed'?'green':status==='Occupied'||status==='Active'?'red':'amber';return `<span class="pill ${c}">${status}</span>`}
function dashboard(){let occupied=slots.filter(s=>s.status==='Occupied').length,available=slots.filter(s=>s.status==='Available').length,active=sessions.filter(s=>s.status==='Active').length;
return head('OVERVIEW','Campus parking at a glance','Monitor parking activity and manage campus vehicle movement.',canSecurity()?'<button onclick="openEntry()">＋ Record vehicle entry</button>':'')+
`<div class="cards">${stat('Total parking slots',slots.length,'Across campus','▤')}${stat('Available slots',available,'Ready for allocation','✓')}${stat('Occupied slots',occupied,'Currently in use','▣')}${stat('Active parking sessions',active,'Vehicles currently inside','↔')}</div>
<div class="grid2"><section class="panel"><div class="panelhead"><h3>Parking slot overview</h3><button class="secondary" onclick="nav('parking')">View all</button></div><div class="slots">${slots.slice(0,15).map(s=>`<div class="slot ${s.status==='Occupied'?'busy':s.status==='Available'?'free':'maint'}"><b>${s.name}</b><span>${s.status}</span></div>`).join('')}</div><p class="sub" style="margin-top:14px">Green: available · Red: occupied · Amber: maintenance</p></section>
<section class="panel"><div class="panelhead"><h3>Recent activity</h3><span class="pill">Today</span></div>${sessions.slice(0,3).map(x=>`<p style="padding:9px 0;border-bottom:1px solid var(--line);margin:0"><b>${x.vehicle}</b><br><small class="sub">${x.owner} · ${x.entry}</small></p>`).join('')}<p style="margin-top:14px"><button class="ghost" onclick="nav('reports')">Open reports</button></p></section></div>`}
function vehiclesPage(){return head('REGISTRY','Vehicle management','Registered campus vehicles and their owners.',canAdmin()||role==='Security Staff'?'<button onclick="openVehicle()">＋ Add vehicle</button>':'')+
`<section class="panel"><div class="toolbar"><input id="vehicleSearch" placeholder="Search owner or vehicle number..." oninput="filterTable('vehicleSearch','vehicleTable')"></div><table id="vehicleTable"><thead><tr><th>Vehicle number</th><th>Owner</th><th>Type</th><th>Category</th><th>Status</th></tr></thead><tbody>${vehicles.map(v=>`<tr><td><b>${v.number}</b></td><td>${v.owner}</td><td>${v.type}</td><td>${v.category}</td><td>${badge(sessions.some(s=>s.vehicle===v.number&&s.status==='Active')?'Parked':'Registered')}</td></tr>`).join('')}</tbody></table></section>`}
function parkingPage(){return head('PARKING OPERATIONS','Parking & slots','View slot availability and manage vehicle entry and exit.',canSecurity()?'<button onclick="openEntry()">＋ Vehicle entry</button>':'')+
`<section class="panel"><div class="panelhead"><h3>All parking slots</h3>${canAdmin()?'<button class="secondary" onclick="toggleMaintenance()">Change slot status</button>':''}</div><div class="slots">${slots.map(s=>`<div class="slot ${s.status==='Occupied'?'busy':s.status==='Available'?'free':'maint'}"><b>${s.name}</b><span>${s.status}</span></div>`).join('')}</div></section><section class="panel" style="margin-top:16px"><div class="panelhead"><h3>Parking records</h3></div><table><thead><tr><th>Vehicle</th><th>Owner</th><th>Slot</th><th>Entry</th><th>Status</th><th>Action</th></tr></thead><tbody>${sessions.map(x=>`<tr><td><b>${x.vehicle}</b></td><td>${x.owner}</td><td>${x.slot}</td><td>${x.entry}</td><td>${badge(x.status)}</td><td>${x.status==='Active'&&canSecurity()?`<button class="secondary" onclick="exitVehicle(${x.id})">Record exit</button>`:'—'}</td></tr>`).join('')}</tbody></table></section>`}
function visitorsPage(){return head('VISITOR LOG','Visitor registration','Maintain a record of visitor vehicles entering campus.',canSecurity()?'<button onclick="openVisitor()">＋ Register visitor</button>':'')+
`<section class="panel"><table><thead><tr><th>Visitor</th><th>Vehicle number</th><th>Purpose</th><th>Visit date</th></tr></thead><tbody>${visitors.map(v=>`<tr><td>${v.name}</td><td><b>${v.number}</b></td><td>${v.purpose}</td><td>${v.date}</td></tr>`).join('')}</tbody></table></section>`}
function violationsPage(){return head('COMPLIANCE','Parking violations','Record and review parking-rule violations.',canSecurity()?'<button onclick="openViolation()">＋ Record violation</button>':'')+
`<section class="panel"><table><thead><tr><th>Vehicle number</th><th>Violation</th><th>Description</th><th>Recorded at</th><th>Status</th></tr></thead><tbody>${violations.map(v=>`<tr><td><b>${v.number}</b></td><td>${v.type}</td><td>${v.detail}</td><td>${v.time}</td><td>${badge('Pending review')}</td></tr>`).join('')}</tbody></table></section>`}
function reportsPage(){let occ=slots.filter(s=>s.status==='Occupied').length;return head('INSIGHTS','Parking reports','A simple summary of current campus parking records.','<button class="secondary" onclick="window.print()">Print report</button>')+
`<div class="cards">${stat('Registered vehicles',vehicles.length,'In vehicle registry','▣')}${stat('Visitor records',visitors.length,'Recorded visitors','♙')}${stat('Violations',violations.length,'Recorded incidents','⚑')}${stat('Slot occupancy',Math.round(occ/slots.length*100)+'%','Current utilization','◔')}</div><section class="panel"><h3>Current slot utilization</h3><div style="height:13px;background:#edf0f5;border-radius:20px;overflow:hidden;margin:16px 0"><div style="height:100%;width:${occ/slots.length*100}%;background:#315efb"></div></div><p class="sub">${occ} of ${slots.length} slots occupied · ${slots.length-occ} slots not occupied (including maintenance).</p><h3 style="margin-top:26px">Report notes</h3><p class="sub">This prototype calculates summaries from the records entered during this browser session. It does not connect to a live college database.</p></section>`}
function render(){let titles={dashboard:'Dashboard',vehicles:'Vehicles',parking:'Parking & Slots',visitors:'Visitors',violations:'Violations',reports:'Reports'};$('#topTitle').textContent=titles[page];let views={dashboard,vehicles:vehiclesPage,parking:parkingPage,visitors:visitorsPage,violations:violationsPage,reports:reportsPage};$('#view').innerHTML=views[page]();$('#roleLabel').textContent=role}
function filterTable(inputId,tableId){let q=$('#'+inputId).value.toLowerCase();document.querySelectorAll('#'+tableId+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function showModal(title,fields,action){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=`<div class="formgrid">${fields.map(f=>`<div class="field ${f.full?'full':''}"><label>${f.label}</label>${f.options?`<select id="${f.id}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${f.id}" placeholder="${f.placeholder||''}" ${f.required===false?'':'required'}>`}</div>`).join('')}</div>`;modalAction=action;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
function val(id){return $('#'+id).value.trim()}
function submitModal(){if(!$('#modalBody').querySelector('input:invalid')){};let ok=[...$('#modalBody').querySelectorAll('input[required]')].every(i=>i.value.trim());if(!ok){toast('Please complete the required fields');return}modalAction();closeModal();render()}
function openVehicle(){showModal('Register vehicle',[{label:'Owner name',id:'owner'},{label:'Vehicle number',id:'number',placeholder:'e.g. DL8CAF1234'},{label:'Vehicle type',id:'type',options:['Car','Bike','Scooter','Other']},{label:'Category',id:'category',options:['Student','Faculty/Staff']}],()=>{vehicles.push({id:Date.now(),owner:val('owner'),number:val('number').toUpperCase(),type:val('type'),category:val('category')});toast('Vehicle registered')})}
function openEntry(){if(!canSecurity()){toast('Security Staff access required');return}let free=slots.filter(s=>s.status==='Available');if(!free.length){toast('No available slots');return}showModal('Record vehicle entry',[{label:'Vehicle number',id:'entryNumber',placeholder:'Registered vehicle number'},{label:'Available slot',id:'entrySlot',options:free.map(s=>s.name)}],()=>{let n=val('entryNumber').toUpperCase(),v=vehicles.find(x=>x.number===n),slot=slots.find(x=>x.name===val('entrySlot'));if(!v){toast('Vehicle not found. Register it first.');return}if(sessions.some(s=>s.vehicle===n&&s.status==='Active')){toast('Vehicle already has an active session');return}if(!slot||slot.status!=='Available'){toast('Slot is no longer available');return}slot.status='Occupied';sessions.unshift({id:Date.now(),vehicle:n,owner:v.owner,slot:slot.name,entry:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),exit:'—',status:'Active'});toast('Vehicle entry recorded')})}
function exitVehicle(id){let s=sessions.find(x=>x.id===id);if(!s||s.status!=='Active')return;s.status='Closed';s.exit=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});let slot=slots.find(x=>x.name===s.slot);if(slot)slot.status='Available';render();toast('Exit recorded; slot released')}
function openVisitor(){showModal('Register visitor',[{label:'Visitor name',id:'vname'},{label:'Vehicle number',id:'vnumber'},{label:'Purpose of visit',id:'purpose'}],()=>{visitors.unshift({name:val('vname'),number:val('vnumber').toUpperCase(),purpose:val('purpose'),date:'Today'});toast('Visitor registered')})}
function openViolation(){showModal('Record parking violation',[{label:'Vehicle number',id:'xnumber'},{label:'Violation type',id:'xtype',options:['Wrong parking','Unauthorized parking','Blocking passage','Other']},{label:'Description',id:'xdetail'}],()=>{violations.unshift({number:val('xnumber').toUpperCase(),type:val('xtype'),detail:val('xdetail'),time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});toast('Violation recorded')})}
function toggleMaintenance(){let a=slots.find(s=>s.status==='Available');if(!a){toast('No available slot to change');return}a.status='Maintenance';render();toast(a.name+' marked under maintenance')}
render();
</script></body></html>
